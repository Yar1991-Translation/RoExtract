name: Debug Build Log
on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/debug-build-log.yml"
      - "src/**"
      - "Cargo.toml"
      - "build.rs"

permissions:
  contents: write

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and capture output
        run: |
          set -o pipefail
          cargo build --verbose --release 2>&1 | tee build.log || true
      - name: Compile tests
        run: |
          set -o pipefail
          cargo test --no-run --verbose 2>&1 | tee -a build.log || true
      - name: Publish build log as release asset
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-log-${{ github.run_id }}"
          gh release create "$TAG" build.log --repo "$GITHUB_REPOSITORY" --title "Build log" || true
          gh release upload "$TAG" build.log --repo "$GITHUB_REPOSITORY" --clobber || true
